name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: ["main"] # hoặc master tuỳ branch chính

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build # Lệnh build ra thư mục dist/build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Đổi thành './build' hoặc '.' nếu là HTML tĩnh thuần không cần build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
